<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rose Bouquet - Opposite Color Contrast</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #130a1c 0%, #06030c 60%, #020104 100%);
  }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.45); font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px; letter-spacing: 0.6px; pointer-events: none; user-select: none;
    text-transform: lowercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click / tap anywhere to re-bloom the bouquet</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function rand(a, b) { return a + Math.random() * (b - a); }
function deg(d) { return d * Math.PI / 180; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

// ---------- COLOR PALETTES ----------
const PINK_PALETTES = [
  { h: [345, 355], s: [85, 95], baseL: [12, 18], tipL: [50, 62] },
  { h: [335, 345], s: [80, 92], baseL: [14, 20], tipL: [55, 68] },
  { h: [350, 360], s: [88, 98], baseL: [10, 16], tipL: [48, 58] }
];

const BLUE_PALETTES = [
  { h: [210, 225], s: [80, 95], baseL: [12, 18], tipL: [52, 65] },
  { h: [225, 240], s: [75, 90], baseL: [14, 20], tipL: [58, 70] },
  { h: [195, 210], s: [85, 95], baseL: [10, 16], tipL: [48, 60] }
];

function hslStr(h, s, l, a = 1) { 
  return `hsla(${((h % 360) + 360) % 360}, ${s}%, ${l}%, ${a})`; 
}

// Organic 3D Petal Path
function tracePetalPath(ctx, len, wid, curve, notch) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(len * 0.25, -wid * 0.55, len * 0.65, -wid * 0.6, len * 0.95, -wid * (0.2 + notch));
  ctx.quadraticCurveTo(len + curve, 0, len * 0.95, wid * (0.2 + notch));
  ctx.bezierCurveTo(len * 0.65, wid * 0.6, len * 0.25, wid * 0.55, 0, 0);
  ctx.closePath();
}

const PETAL_LAYERS = [
  { count: 10, radiusRatio: 0.85, lenRatio: 0.52, widRatio: 0.46, curveRatio: 0.15, notch: 0.08, yOff: 0.0 },
  { count: 8,  radiusRatio: 0.65, lenRatio: 0.44, widRatio: 0.40, curveRatio: 0.12, notch: 0.05, yOff: -0.02 },
  { count: 7,  radiusRatio: 0.45, lenRatio: 0.36, widRatio: 0.34, curveRatio: 0.08, notch: 0.02, yOff: -0.03 },
  { count: 5,  radiusRatio: 0.28, lenRatio: 0.28, widRatio: 0.26, curveRatio: 0.04, notch: 0.0,  yOff: -0.04 },
  { count: 4,  radiusRatio: 0.14, lenRatio: 0.18, widRatio: 0.18, curveRatio: 0.01, notch: -0.02, yOff: -0.05 }
];

class Petal {
  constructor(roseR, layerConfig, layerIdx, angle, palette) {
    this.layerIdx = layerIdx;
    this.angle = angle;
    
    const r = roseR * layerConfig.radiusRatio;
    this.attachX = Math.cos(angle) * r * 0.4;
    this.attachY = Math.sin(angle) * r * 0.4 + roseR * layerConfig.yOff;
    
    this.len = roseR * layerConfig.lenRatio * rand(0.92, 1.08);
    this.wid = roseR * layerConfig.widRatio * rand(0.92, 1.08);
    this.curve = roseR * layerConfig.curveRatio;
    this.notch = layerConfig.notch;

    const hue = rand(palette.h[0], palette.h[1]);
    const sat = rand(palette.s[0], palette.s[1]);
    
    const layerShade = (4 - layerIdx) * 3;
    this.baseColor = [hue, sat, Math.max(4, rand(palette.baseL[0], palette.baseL[1]) - layerShade)];
    this.tipColor  = [hue, sat, rand(palette.tipL[0], palette.tipL[1]) - layerShade * 0.5];

    this.delay = rand(0.0, 0.3) + (4 - layerIdx) * 0.1;
    this.progress = 0;
    this.speed = rand(0.010, 0.016);
    this.dropDist = rand(40, 90);
  }

  update(t) {
    if (t > this.delay && this.progress < 1) {
      this.progress = Math.min(1, this.progress + this.speed);
    }
  }

  draw(ctx, cx, cy, swayAngle) {
    if (this.progress <= 0) return;

    const e = easeOutCubic(this.progress);
    const offsetY = this.dropDist * (1 - e);
    
    const currentLen = this.len * (0.3 + 0.7 * e);
    const currentWid = this.wid * (0.3 + 0.7 * e);

    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(cx + this.attachX, cy + this.attachY + offsetY);
    ctx.rotate(this.angle + swayAngle * 0.25);

    tracePetalPath(ctx, currentLen, currentWid, this.curve, this.notch);

    const grad = ctx.createLinearGradient(0, 0, currentLen, 0);
    grad.addColorStop(0.0, hslStr(this.baseColor[0], this.baseColor[1], this.baseColor[2]));
    grad.addColorStop(0.65, hslStr(this.tipColor[0], this.tipColor[1], this.tipColor[2] * 0.85));
    grad.addColorStop(1.0, hslStr(this.tipColor[0], this.tipColor[1], this.tipColor[2]));

    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 0.5;
    ctx.strokeStyle = hslStr(this.baseColor[0], this.baseColor[1], Math.max(0, this.baseColor[2] - 6), 0.3 * e);
    ctx.stroke();

    ctx.restore();
  }
}

class Stem {
  constructor(R, x, y, tieX, tieY) {
    this.R = R;
    this.x = x;
    this.y = y;
    this.tieX = tieX;
    this.tieY = tieY;
    
    this.width = Math.max(3, R * 0.05);
    this.color = { h: rand(105, 125), s: rand(45, 60), l: rand(16, 24) };
    
    this.leaves = [-1, 1].map(side => ({
      side,
      t: rand(0.2, 0.4),
      angle: side * deg(50) + rand(-0.15, 0.15),
      len: R * rand(0.6, 0.8),
      wid: R * rand(0.3, 0.4)
    }));

    this.progress = 0;
    this.speed = rand(0.010, 0.016);
    this.dropDist = rand(50, 100);
  }

  update(t) {
    if (this.progress < 1) {
      this.progress = Math.min(1, this.progress + this.speed);
    }
  }

  draw(ctx, swayAngle) {
    if (this.progress <= 0) return;

    const e = easeOutCubic(this.progress);
    const offsetY = this.dropDist * (1 - e);

    ctx.save();
    ctx.globalAlpha = e;
    
    const startX = this.x + swayAngle * 25;
    const startY = this.y + offsetY;
    const endX = this.tieX + swayAngle * 6;
    const endY = this.tieY + offsetY + 80;

    const midX = (startX + endX) / 2 + (startX - endX) * 0.15;
    const midY = (startY + endY) / 2;

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(midX, midY, endX, endY);

    const grad = ctx.createLinearGradient(startX, startY, endX, endY);
    grad.addColorStop(0, hslStr(this.color.h, this.color.s, this.color.l + 8));
    grad.addColorStop(1, hslStr(this.color.h, this.color.s, this.color.l - 4));
    
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.width;
    ctx.lineCap = 'round';
    ctx.stroke();

    this.leaves.forEach(leaf => {
      const lx = startX + (endX - startX) * leaf.t;
      const ly = startY + (endY - startY) * leaf.t;

      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(leaf.angle + swayAngle * 0.3);

      tracePetalPath(ctx, leaf.len, leaf.wid, leaf.len * 0.12, 0);
      const leafGrad = ctx.createLinearGradient(0, 0, leaf.len, 0);
      leafGrad.addColorStop(0, hslStr(this.color.h, this.color.s, this.color.l - 2));
      leafGrad.addColorStop(1, hslStr(this.color.h, this.color.s + 12, this.color.l + 14));
      ctx.fillStyle = leafGrad;
      ctx.fill();

      ctx.restore();
    });

    ctx.restore();
  }
}

class Rose {
  constructor(cx, cy, R, palette, tieX, tieY) {
    this.cx = cx; 
    this.cy = cy; 
    this.R = R;
    
    this.stem = new Stem(R, cx, cy, tieX, tieY);
    this.petals = [];

    PETAL_LAYERS.forEach((layerConfig, layerIdx) => {
      const angleStep = (Math.PI * 2) / layerConfig.count;
      const offset = (layerIdx % 2) * (angleStep / 2) + rand(-0.1, 0.1);
      
      for (let p = 0; p < layerConfig.count; p++) {
        const a = p * angleStep + offset + rand(-0.05, 0.05);
        this.petals.push(new Petal(R, layerConfig, layerIdx, a, palette));
      }
    });

    this.petals.sort((a, b) => a.layerIdx - b.layerIdx);
  }

  update(t) {
    this.stem.update(t);
    this.petals.forEach(p => p.update(t));
  }

  draw(ctx, breezeOffset) {
    const spatialSway = Math.sin(breezeOffset + this.cx * 0.003 + this.cy * 0.002) * 0.06;
    
    this.stem.draw(ctx, spatialSway);

    ctx.save();
    ctx.translate(this.cx, this.cy);
    
    const centerPetal = this.petals[this.petals.length - 1];
    if (centerPetal && centerPetal.progress > 0) {
      ctx.save();
      ctx.rotate(spatialSway * 0.3);
      ctx.beginPath();
      ctx.arc(0, -this.R * 0.04, this.R * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = hslStr(centerPetal.baseColor[0], centerPetal.baseColor[1], centerPetal.baseColor[2] * 0.65);
      ctx.fill();
      ctx.restore();
    }

    this.petals.forEach(p => p.draw(ctx, 0, 0, spatialSway));
    ctx.restore();
  }
}

function drawEucalyptusSprig(ctx, x, y, angle, scale, sway) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + sway * 0.2);
  ctx.scale(scale, scale);

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -100);
  ctx.strokeStyle = 'hsl(140, 20%, 25%)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const pairs = [20, 45, 70, 90];
  pairs.forEach((py, i) => {
    const r = 14 - i * 2;
    ctx.beginPath();
    ctx.arc(-r + 2, -py, r, 0, Math.PI * 2);
    ctx.fillStyle = 'hsl(150, 25%, 38%)';
    ctx.fill();
    ctx.strokeStyle = 'hsl(150, 30%, 48%)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(r - 2, -py, r, 0, Math.PI * 2);
    ctx.fillStyle = 'hsl(145, 22%, 34%)';
    ctx.fill();
    ctx.stroke();
  });

  ctx.restore();
}

// ---------- SIDE ACCENTS (Blue Left / Pink Right) ----------
class SideAccents {
  constructor() {
    this.particles = [];
    for (let i = 0; i < 40; i++) {
      this.particles.push(this.createParticle());
    }
  }

  createParticle() {
    const isLeft = Math.random() < 0.5;
    return {
      side: isLeft ? 'left' : 'right',
      x: isLeft ? rand(W * 0.02, W * 0.28) : rand(W * 0.72, W * 0.98),
      y: rand(H * 0.1, H * 0.9),
      size: rand(1.5, 4.5),
      speedY: rand(-0.2, -0.6),
      speedX: rand(-0.2, 0.2),
      alpha: rand(0.2, 0.8),
      hue: isLeft ? rand(190, 215) : rand(330, 350) // Blue Left / Pink Right
    };
  }

  update() {
    this.particles.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.alpha += rand(-0.01, 0.01);
      if (p.alpha < 0.1) p.alpha = 0.1;
      if (p.alpha > 0.8) p.alpha = 0.8;

      if (p.y < 0) {
        p.y = H + 10;
        p.x = p.side === 'left' ? rand(W * 0.02, W * 0.28) : rand(W * 0.72, W * 0.98);
      }
    });
  }

  draw(ctx, t) {
    const sway = Math.sin(t * 1.5) * 0.08;

    // 1. LEFT SIDE: BLUEISH LEAF STEMS
    ctx.save();
    drawLeafBranch(ctx, W * 0.12, H * 0.65, deg(-35) + sway, 1.2, 210, 60, 35);
    drawLeafBranch(ctx, W * 0.05, H * 0.45, deg(-15) - sway, 0.9, 220, 70, 45);
    ctx.restore();

    // 2. RIGHT SIDE: PINKISH LEAF STEMS
    ctx.save();
    drawLeafBranch(ctx, W * 0.88, H * 0.65, deg(35) - sway, 1.2, 340, 65, 35);
    drawLeafBranch(ctx, W * 0.95, H * 0.45, deg(15) + sway, 0.9, 350, 75, 45);
    ctx.restore();

    // 3. Floating Sparkles
    this.particles.forEach(p => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 80%, 65%, ${p.alpha})`;
      ctx.shadowColor = `hsl(${p.hue}, 90%, 70%)`;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    });
  }
}

function drawLeafBranch(ctx, x, y, angle, scale, hue, sat, light) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(15, -60, 0, -120);
  ctx.strokeStyle = `hsl(${hue}, ${sat - 20}%, ${light - 15}%)`;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const leafPos = [20, 45, 70, 95];
  leafPos.forEach((py, i) => {
    const leafLen = 22 - i * 2;
    const leafWid = 10 - i * 1;

    ctx.save();
    ctx.translate(-2, -py);
    ctx.rotate(-deg(45));
    tracePetalPath(ctx, leafLen, leafWid, 2, 0);
    ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(2, -py + 8);
    ctx.rotate(deg(45));
    tracePetalPath(ctx, leafLen, leafWid, 2, 0);
    ctx.fillStyle = `hsl(${hue}, ${sat - 10}%, ${light - 5}%)`;
    ctx.fill();
    ctx.restore();
  });

  ctx.restore();
}

// ---------- HEART FIREWORKS ----------
class Rocket {
  constructor(startX, startY, targetX, targetY) {
    this.x = startX;
    this.y = startY;
    this.targetX = targetX;
    this.targetY = targetY;
    
    const angle = Math.atan2(targetY - startY, targetX - startX);
    const speed = rand(7, 10);

    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.exploded = false;
    this.trail = [];
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.shift();

    this.x += this.vx;
    this.y += this.vy;

    if (this.vy < 0 && this.y <= this.targetY) {
      this.exploded = true;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < this.trail.length; i++) {
      const pt = this.trail[i];
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.strokeStyle = 'hsla(345, 90%, 65%, 0.8)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }
}

class HeartParticle {
  constructor(x, y, vx, vy, color) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.alpha = 1;
    this.decay = rand(0.012, 0.022);
    this.size = rand(2, 3.5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.vy += 0.04;
    this.alpha -= this.decay;
  }

  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class FireworkManager {
  constructor() {
    this.rockets = [];
    this.particles = [];
    this.timer = 0;
  }

  launch() {
    const fromLeft = Math.random() < 0.5;
    const startX = fromLeft ? rand(W * 0.05, W * 0.25) : rand(W * 0.75, W * 0.95);
    const startY = H + 10;
    
    const targetX = fromLeft ? rand(W * 0.15, W * 0.38) : rand(W * 0.62, W * 0.85);
    const targetY = rand(H * 0.15, H * 0.55);

    this.rockets.push(new Rocket(startX, startY, targetX, targetY));
  }

  explodeHeart(x, y) {
    const particleCount = 75;
    const scale = rand(2.2, 3.2);

    for (let i = 0; i < particleCount; i++) {
      const t = (i / particleCount) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

      const vx = (hx / 16) * scale * rand(0.9, 1.1);
      const vy = (hy / 16) * scale * rand(0.9, 1.1);

      // Matches fireworks colors (Blue on Left / Pink on Right)
      const isLeft = x < W / 2;
      const hue = isLeft ? rand(210, 230) : rand(340, 355);
      const sat = rand(85, 100);
      const light = rand(55, 70);
      const color = `hsl(${hue}, ${sat}%, ${light}%)`;

      this.particles.push(new HeartParticle(x, y, vx, vy, color));
    }
  }

  update() {
    this.timer++;
    if (this.timer % 40 === 0) {
      this.launch();
    }

    for (let i = this.rockets.length - 1; i >= 0; i--) {
      const r = this.rockets[i];
      r.update();
      if (r.exploded) {
        this.explodeHeart(r.x, r.y);
        this.rockets.splice(i, 1);
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.update();
      if (p.alpha <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }

  draw(ctx) {
    this.rockets.forEach(r => r.draw(ctx));
    this.particles.forEach(p => p.draw(ctx));
  }
}

// ---------- BOUQUET LAYOUT (PINK LEFT / BLUE RIGHT) ----------
const N_ROSES = 10;
let roses = [];
let sprigs = [];
let tiePoint = { x: 0, y: 0 };
let fireworks = new FireworkManager();
let sideAccents = new SideAccents();
let startTime = performance.now();

function buildScene() {
  roses = [];
  sprigs = [];
  fireworks = new FireworkManager();
  sideAccents = new SideAccents();
  startTime = performance.now();
  
  const cx = W / 2;
  const cy = H / 2 - H * 0.06;
  tiePoint = { x: cx, y: cy + H * 0.32 };

  const unit = Math.min(W, H) * 0.115;
  const roseR = unit * 0.65;

  const layout = [
    // Top Row
    { x: cx - unit * 1.1, y: cy - unit * 1.15, order: 1 },
    { x: cx,              y: cy - unit * 1.35, order: 1 },
    { x: cx + unit * 1.1, y: cy - unit * 1.15, order: 1 },

    // Middle Row
    { x: cx - unit * 1.55, y: cy - unit * 0.10, order: 2 },
    { x: cx - unit * 0.52, y: cy - unit * 0.25, order: 3 },
    { x: cx + unit * 0.52, y: cy - unit * 0.25, order: 3 },
    { x: cx + unit * 1.55, y: cy - unit * 0.10, order: 2 },

    // Bottom Row
    { x: cx - unit * 1.0, y: cy + unit * 0.75, order: 4 },
    { x: cx,              y: cy + unit * 0.85, order: 4 },
    { x: cx + unit * 1.0, y: cy + unit * 0.75, order: 4 }
  ];

  layout.sort((a, b) => a.order - b.order);

  layout.forEach(pos => {
    let palette;
    // OPPOSITE PALETTE LAYOUT:
    // Left side flowers = PINK, Right side flowers = BLUE
    if (pos.x < cx - unit * 0.2) {
      palette = PINK_PALETTES[Math.floor(Math.random() * PINK_PALETTES.length)];
    } else if (pos.x > cx + unit * 0.2) {
      palette = BLUE_PALETTES[Math.floor(Math.random() * BLUE_PALETTES.length)];
    } else {
      palette = Math.random() < 0.5 
        ? PINK_PALETTES[Math.floor(Math.random() * PINK_PALETTES.length)]
        : BLUE_PALETTES[Math.floor(Math.random() * BLUE_PALETTES.length)];
    }

    roses.push(new Rose(pos.x, pos.y, roseR, palette, tiePoint.x, tiePoint.y));
  });

  sprigs = [
    { x: cx - unit * 0.8, y: cy - unit * 0.5, a: deg(-30), s: 0.75 },
    { x: cx + unit * 0.8, y: cy - unit * 0.5, a: deg(30),  s: 0.75 },
    { x: cx - unit * 1.4, y: cy + unit * 0.2, a: deg(-50), s: 0.65 },
    { x: cx + unit * 1.4, y: cy + unit * 0.2, a: deg(50),  s: 0.65 },
    { x: cx,              y: cy - unit * 0.7, a: deg(0),   s: 0.85 }
  ];
}

buildScene();
canvas.addEventListener('click', buildScene);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); buildScene(); }, { passive: false });

function drawRibbon(ctx, t) {
  const sway = Math.sin(t * 1.8) * 5;
  const rx = tiePoint.x + sway * 0.5;
  const ry = tiePoint.y;

  ctx.save();
  ctx.fillStyle = '#4a154b';
  ctx.fillRect(rx - 20, ry - 10, 40, 20);
  ctx.fillStyle = '#6a226c';
  ctx.fillRect(rx - 20, ry - 4, 40, 10);

  ctx.beginPath();
  ctx.moveTo(rx - 8, ry + 10);
  ctx.quadraticCurveTo(rx - 20 + sway, ry + 60, rx - 30 + sway * 1.4, ry + 100);
  ctx.lineWidth = 7;
  ctx.strokeStyle = '#4a154b';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(rx + 8, ry + 10);
  ctx.quadraticCurveTo(rx + 12 + sway, ry + 65, rx + 22 + sway * 1.4, ry + 105);
  ctx.stroke();

  ctx.restore();
}

function frame(now) {
  const t = (now - startTime) / 1000;
  ctx.clearRect(0, 0, W, H);

  // Background Ambient Glow (Blue Left, Pink Right to match sides)
  const gBlue = ctx.createRadialGradient(W * 0.3, H * 0.4, 0, W * 0.3, H * 0.4, W * 0.5);
  gBlue.addColorStop(0, 'rgba(10, 20, 50, 0.4)');
  gBlue.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gBlue;
  ctx.fillRect(0, 0, W, H);

  const gPink = ctx.createRadialGradient(W * 0.7, H * 0.4, 0, W * 0.7, H * 0.4, W * 0.5);
  gPink.addColorStop(0, 'rgba(50, 10, 30, 0.4)');
  gPink.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gPink;
  ctx.fillRect(0, 0, W, H);

  const breezePhase = t * 1.8;
  const sway = Math.sin(breezePhase) * 0.05;

  // 1. Render Side Accents (Blue Left, Pink Right)
  sideAccents.update();
  sideAccents.draw(ctx, t);

  // 2. Render Fireworks
  fireworks.update();
  fireworks.draw(ctx);

  // 3. Render Filler Greenery
  sprigs.forEach(sp => drawEucalyptusSprig(ctx, sp.x, sp.y, sp.a, sp.s, sway));

  // 4. Render Roses (Pink Left, Blue Right)
  for (let i = 0; i < roses.length; i++) {
    roses[i].update(t);
    roses[i].draw(ctx, breezePhase);
  }

  // 5. Render Ribbon
  drawRibbon(ctx, breezePhase);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
